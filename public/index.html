<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raabta Live — real-time voice agent on AssemblyAI</title>
    <meta
      name="description"
      content="A real-time voice agent built on AssemblyAI Universal-Streaming — talk to it, interrupt it, read along."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-state="idle">
    <div class="aurora" aria-hidden="true"></div>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">◉</span>
          <div>
            <h1>Raabta&nbsp;Live</h1>
            <p class="tag">real-time voice agents · powered by AssemblyAI Universal-Streaming</p>
          </div>
        </div>
        <div class="status">
          <span id="statusDot" class="dot idle"></span>
          <span id="statusText">idle</span>
        </div>
      </header>

      <main class="stage">
        <!-- the voice orb: the live visualizer -->
        <div class="orb-wrap">
          <div class="orb-rings" aria-hidden="true"><span></span><span></span><span></span></div>
          <button id="orb" class="orb" aria-label="Start call">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
              <path d="M19 10v1a7 7 0 0 1-14 0v-1" />
              <line x1="12" y1="19" x2="12" y2="22" />
            </svg>
          </button>
        </div>

        <section id="transcript" class="transcript" aria-live="polite"></section>
        <div id="interim" class="interim" hidden></div>
        <p id="hint" class="hint">
          Tap the orb (or <strong>Start call</strong>) and allow the microphone. Speak naturally — you can
          talk over the agent to interrupt it. No mic? Type below to test the brain.
        </p>
        <p class="hint sub">
          <a href="/dashboard" class="dash-link">Building your own agent? Open the dashboard →</a>
        </p>
      </main>

      <footer class="controls">
        <button id="startBtn" class="btn primary">Start call</button>
        <button id="stopBtn" class="btn ghost" disabled>End</button>
        <div class="meter" title="microphone level"><span id="meterFill"></span></div>
        <form id="textForm" class="typebar">
          <input id="textInput" type="text" autocomplete="off" placeholder="or type to test the brain…" />
          <button class="btn ghost" type="submit">Send</button>
        </form>
      </footer>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
