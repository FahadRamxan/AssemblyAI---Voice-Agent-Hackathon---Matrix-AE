<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Raabta Live">
  <title>Raabta Live</title>
  <defs>
    <linearGradient id="rl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#070b12"/>
  <!-- voice pulse: a source dot radiating rings (raabta = connection, live) -->
  <g fill="none" stroke="url(#rl)" stroke-width="2" stroke-linecap="round">
    <circle cx="16" cy="16" r="11" opacity="0.3"/>
    <circle cx="16" cy="16" r="7" opacity="0.65"/>
  </g>
  <circle cx="16" cy="16" r="3.2" fill="url(#rl)"/>
</svg>
