<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 44" width="208" height="44" role="img" aria-label="Raabta Live">
  <title>Raabta Live</title>
  <defs>
    <linearGradient id="rl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- mark: voice pulse -->
  <g transform="translate(22 22)">
    <g fill="none" stroke="url(#rl)" stroke-width="2.2" stroke-linecap="round">
      <circle r="12" opacity="0.3"/>
      <circle r="7.6" opacity="0.65"/>
    </g>
    <circle r="3.4" fill="url(#rl)"/>
  </g>
  <!-- wordmark -->
  <text x="46" y="29" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.4">
    <tspan fill="#eaf1fa">Raabta</tspan><tspan fill="#2dd4bf"> Live</tspan>
  </text>
</svg>
